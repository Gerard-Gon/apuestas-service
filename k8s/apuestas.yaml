apiVersion: apps/v1
kind: Deployment
metadata:
  name: apuestas-deployment # ej: apuestas-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apuestas
  template:
    metadata:
      labels:
        app: apuestas
    spec:
      containers:
      - name: apuestas
        image: 914091100375.dkr.ecr.us-east-1.amazonaws.com/apuestas-service:latest
        ports:
        - containerPort: 3000
        # CAMBIO: Inyectamos el host de la BD para que el código no busque localhost
        env:
        - name: DB_HOST
          value: "postgres-service"
        envFrom:
        - secretRef:
            name: casino-secrets
        # CAMBIO: Agregamos las sondas de salud que definiste en tu código
        livenessProbe:
          httpGet:
            path: /livez
            port: 3000
          initialDelaySeconds: 10
        readinessProbe:
          httpGet:
            path: /readyz
            port: 3000
          initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: apuestas-service
spec:
  type: ClusterIP
  selector:
    app: apuestas 
  ports:
  - port: 3000
    targetPort: 3000