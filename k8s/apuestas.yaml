apiVersion: apps/v1
kind: Deployment
metadata:
  name: apuestas-deployment # ej: apuestas-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apuestas
  template:
    metadata:
      labels:
        app: apuestas
    spec:
      containers:
      - name: apuestas
        image: 914091100375.dkr.ecr.us-east-1.amazonaws.com/apuestas:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: casino-secrets
---
apiVersion: v1
kind: Service
metadata:
  name: apuestas-service
spec:
  type: ClusterIP
  selector:
    app: apuestas 
  ports:
  - port: 3000
    targetPort: 3000